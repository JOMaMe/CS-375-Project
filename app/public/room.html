<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Room</title>
  <link rel="stylesheet" type="text/css" href="theme.css">
  <link rel="stylesheet" type="text/css" href="room.css">
</head>
<body class="room-page">
<div class="menu" id="waiting-room">
    <h1>Waiting Room</h1>
    <p>Room code: <strong id="room-code"></strong></p>
    <p id="connection-status" role="status">Connecting to room...</p>
    <button id="start" hidden>Start Game</button>
    <h2>Players</h2>
    <ul id="players"></ul>
</div>

<div class="game-window" hidden>
    <div class="container">
        <div class="rendering-window" id="game-scene" aria-label="Dungeon scene preview"></div>
        <div id="map" class="menu">Map Menu</div>
        <div id="bottom-bar">
            <div id="action" class="menu">Action Bar</div>
            <div id="inventory" class="menu">Inventory Bar</div>
        </div>
        <div id="stats" class="menu">
            <h2>Scene preview</h2>
            <p id="scene-status" role="status">Waiting for the scene.</p>
            <p id="scene-selection" role="status">No character selected.</p>
            <p>Hover over a character to highlight it. Click to select it.</p>
            <button class="scene-target" data-character="0">Select character 1</button>
            <button class="scene-target" data-character="1">Select character 2</button>
        </div>
    </div>
</div>
<script src="vendor/pixi-8.6.6.min.js"></script>
<script src="game-scene.js"></script>
<script src="room.js"></script>
</body>
