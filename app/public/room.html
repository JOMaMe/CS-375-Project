<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Room</title>
  <link rel="stylesheet" type="text/css" href="theme.css">
  <link rel="stylesheet" type="text/css" href="room.css">
</head>
<body class="room-page">
<div class="menu" id="waiting-room">
    <h1>Waiting Room</h1>
    <p>Room code: <strong id="room-code"></strong></p>
    <p id="connection-status" role="status">Connecting to room...</p>
    <button id="start" hidden>Start Game</button>
    <h2>Players</h2>
    <ul id="players"></ul>
</div>

<div class="game-window" hidden>
    <div class="container">
        <div class="rendering-window">
            <div class="background-layer">
                <img src="assets/background.jpg">
            </div>

            <div class="character-layer">
                <img id="peter" src="assets/Peter_Griffin.webp" style="left: 100px; top: 200px;">
                <img id="peter" src="assets/Peter_Griffin.webp" style="left: 400px; top: 200px;">
            </div>

            <div class="vfx-layer">
                <img src="">
            </div>
        </div>
        <div id="map" class="menu">Map Menu</div>
        <div id="bottom-bar">
            <div id="action" class="menu">Action Bar</div>
            <div id="inventory" class="menu">Inventory Bar</div>
        </div>
        <div id="stats" class="menu">Stats Menu</div>
    </div>
</div>
<script src="room.js"></script>
</body>
