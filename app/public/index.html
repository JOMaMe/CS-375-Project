<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funny Moment</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <h1>Family Guys: United In Arms</h1>

  <div class="form">
    <div>
      <label for="code">Room Code</label>
      <input id="code" type="text" name="code">
      <button id="join">Join Room</button>
    </div>
    <div>
      <button id="host">Host Room</button>
    </div>
  </div>
  <div id="message"></div>

  <script>
    let messageBox = document.getElementById("message");
    let codeInput = document.getElementById("code");

    let joinButton = document.getElementById("join");
    joinButton.addEventListener("click", () => {
      fetch(`/get-code?code=${encodeURIComponent(codeInput.value)}`).then((response) =>
        response.text().then((body) => {
        if (!response.ok) {
          throw new Error(body);
        }
        return body;
      })).then((code) => {
        messageBox.textContent = `Joining room ${code}`;
      }).catch((error) => {
        const message = error instanceof Error ? error.message : String(error);
        messageBox.textContent = message;
        console.error(error);
      });
    });

    let hostButton = document.getElementById("host");
    hostButton.addEventListener("click", () => {
      fetch(`/get-new-code`).then((response) => 
        response.text().then((body) => {
        if (!response.ok) {
          throw new Error(body);
        }
        return body;
      })).then((code) => {
        messageBox.textContent = `Hosting room ${code}`;
      }).catch((error) => {
        const message = error instanceof Error ? error.message : String(error);
        messageBox.textContent = message;
        console.error(error);
      });
    });

  </script>

  <img id="peter" src="assets/Peter_Griffin.webp" alt="Peter Griffin">
  <audio id="music" src="assets/YTDown.com_YouTube_Media_8UjGXx8ta8c_MIX-DE-CUMBIA-REBAJADA-CHOPPED-AND-SCREWED-PARA-QUE-LO-LLORE-LA-COMPETENCIA_007_128k.mp3" loop></audio>
  <script>
    document.addEventListener("click", () => document.getElementById("music").play(), { once: true });
  </script>
</body>
</html>
