<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funny Moment</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <h1>Family Guys: United In Arms</h1>

  <div class="form">
    <div>
      <label for="code">Room Code</label>
      <input id="code" type="text" name="code">
      <button id="join">Join Room</button>
    </div>
    <div>
      <button id="host">Host Room</button>
    </div>
  </div>
  <div id="message"></div>

  <script>
    let messageBox = document.getElementById("message");
    let codeInput = document.getElementById("code");

    let joinButton = document.getElementById("join");
    joinButton.addEventListener("click", () => {
      messageBox.textContent = `Joining room ${codeInput.value}`;
    });

    let hostButton = document.getElementById("host");
    hostButton.addEventListener("click", () => {
      messageBox.textContent = `Hosting room XXXX`;
    });

  </script>
